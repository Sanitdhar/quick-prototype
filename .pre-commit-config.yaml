# One hook runner for both ecosystems — see docs/STACK.md for why we use
# the `pre-commit` framework instead of Husky+lint-staged even though most
# prototypes are TS: it's the only orchestrator that's language-agnostic.
#
# Install once per clone:
#   uv tool install pre-commit --with pre-commit-uv
#   pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (python)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format (python)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: eslint
        name: eslint (ts/tsx)
        entry: pnpm exec eslint --fix
        language: system
        types_or: [ts, tsx]

      - id: prettier
        name: prettier (non-python)
        entry: pnpm exec prettier --write
        language: system
        exclude_types: [python]
